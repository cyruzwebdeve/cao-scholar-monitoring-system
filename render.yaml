services:
  - type: web
    name: cao-scholar-monitoring-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_TARGET
        value: cloud
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: DOCUMENT_BLOB_READ_WRITE_TOKEN
        sync: false
      - key: ANNOUNCEMENT_BLOB_READ_WRITE_TOKEN
        sync: false
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: MAIL_FROM_NAME
        value: PGCEAP Community Affairs Office
      - key: APP_BASE_URL
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: PGCEAP Super Administrator
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
